services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: cs409-hw2-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD}"
    ports:
      - "${MSSQL_PORT:-1433}:1433"
    volumes:
      - hw2-sqlserver-data:/var/opt/mssql
    restart: unless-stopped

volumes:
  hw2-sqlserver-data:

